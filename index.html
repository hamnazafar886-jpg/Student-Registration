<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>

    <a href="form2.html">Home</a>
    <h1>Student Registration Form</h1>

    <form action="thanks.html" method="get">

        Full Name: <input type="text" name="fullname" required placeholder="Enter your full name">
        <br><br>

        Registration No: <input type="text" name="regno" required>
        <br><br>

        Email: <input type="email" name="email" required>
        <br><br>

        Phone: <input type="tel" name="phone" placeholder="03XXXXXXXXX">
        <br><br>

        Age: <input type="number" name="age" min="16" max="40">
        <br><br>

        Date of Birth: <input type="date" name="dob">
        <br><br>

        Gender:
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        Department:
        <select name="department">
            <option>AI</option>
            <option>CS</option>
            <option>SE</option>
            <option>EE</option>
        </select>
        <br><br>

        Interests:
        <input type="checkbox" name="interest" value="Web"> Web
        <input type="checkbox" name="interest" value="AI"> AI
        <input type="checkbox" name="interest" value="Games"> Games
        <br><br>

        Address:
        <br>
        <textarea name="address" rows="4" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">
        

    </form>

</body>
</html>
